# Render — production service for Paradox.
#
# Create it once from the Render dashboard: New + → Blueprint → this repository
# (repo linked, branch `main`). Every push to `main` then builds and deploys.
# If a service already exists for this repo, attach these same values to it
# instead of creating a second one.
#
# Node version comes from `engines` in package.json (`>=22.12 <25`). The upper
# bound is deliberate: Render resolves an unbounded range to the newest Node it
# has, so a new major would change the runtime without any change in this repo.
# Verified locally on Node 24; Render's current default is 24.x.
#
# The build needs no database and no AI key: the Postgres pool and every
# provider client are created on first use, not at import time, so `next build`
# reproduces from a clean checkout. `GET /api/health` is deliberately outside
# the Clerk middleware, so the health check answers even when auth is not
# configured yet.

services:
  - type: web
    name: aiparadox
    runtime: node
    # Free tier keeps the app asleep between visits; change it in the dashboard
    # when traffic needs a plan that stays up.
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    # Runs after the build and before the new version takes traffic. Enable it
    # only after the database has been baselined once (see README →
    # "Base de datos y migraciones"): until then the first pre-deploy would fail
    # on migrations that are already applied, and the deploy would stop safely
    # with the previous version still serving.
    # preDeployCommand: node scripts/migrate.mjs

    envVars:
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # sync: false → Render creates the entry in the dashboard and the owner
      # pastes the value. No secret is stored in this file.
      - key: DATABASE_URL # Neon, pooled — application queries
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon, direct — migrations (DDL needs a session)
        sync: false
      - key: CLERK_SECRET_KEY # Clerk, server side
        sync: false
      # Inlined into the browser bundle at BUILD time: a build without it ships
      # an app that can never sign anyone in.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL # public URL of this service
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: TRIGGER_SECRET_KEY # chat + automations worker
        sync: false
      # Optional, per feature (add them in the dashboard when enabling it):
      #   OPENROUTER_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY, CEREBRAS_API_KEY,
      #   GROQ_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN,
      #   BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID,
      #   RESEND_API_KEY, RESEND_FROM, ZERNIO_API_KEY, DAYTONA_API_KEY,
      #   INTEGRATIONS_ENCRYPTION_KEY,
      #   SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN, NEXT_PUBLIC_SENTRY_DSN
      # Full list with purpose and required/optional status: README →
      # "Variables de entorno" and .env.example.
