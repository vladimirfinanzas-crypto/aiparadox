# Netlify — production for https://aiparadox.netlify.app
#
# `publish = ".next"` is what Netlify's Next.js runtime expects: it rewrites the
# output into Netlify Functions at deploy time, so this is not a static export.
#
# Node is pinned explicitly: the dependency tree (AI SDK packages require >=22,
# Vitest 5 requires >=22.12) does not run on the older build-image defaults, and
# a silent default change would otherwise break the next deploy.
#
# Variables this deployment needs (Site configuration → Environment variables):
#   DATABASE_URL, DATABASE_URL_UNPOOLED   Neon (pooled / direct)
#   CLERK_SECRET_KEY                      Clerk secret key
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY     Clerk publishable key — inlined into
#                                         the browser bundle at BUILD time, so a
#                                         build without it ships an app that can
#                                         never sign anyone in
#   NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SITE_URL
#   TRIGGER_SECRET_KEY                    chat + automations worker
# and whichever optional providers are enabled (OPENROUTER_API_KEY, …).
#
# The build itself needs none of the AI keys and no database connection: they are
# read lazily at request time. See README → "Despliegue en Netlify".

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # These are public configuration identifiers, not authentication credentials.
  # Keep secret scanning enabled for all other environment variables and files.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_RUNTIME,TRIGGER_PROJECT_REF,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_PUBLIC_SENTRY_DSN"
